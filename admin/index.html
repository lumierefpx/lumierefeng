    :root {

    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* ── Setup ── */
    .setup { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
    .setup-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 40px; width: 100%; max-width: 420px; }

    .setup-card a { color: var(--accent); }
    .field-group { margin-bottom: 20px; }
    .field-label { display: block; font-size: 11px; font-weight: 500; letter-spacing: 0.6px; text-transform: uppercase; color: var(--muted); margin-bottom: 7px; }
    .setup-error { font-size: 13px; color: #c0392b; margin-bottom: 14px; display: none; }

    .brand { font-size: 13px; font-weight: 500; color: var(--accent); text-decoration: none; }
    .pipe { color: var(--border); }
    .topbar-label { font-size: 13px; color: var(--muted); }
    .topbar-right { display: flex; gap: 8px; }

    .body { max-width: 740px; margin: 0 auto; width: 100%; padding: 36px 24px 100px; }

      width: 100%; font-family: inherit; font-size: clamp(1.5rem, 3.5vw, 2rem);
      font-weight: 300; color: var(--text); border: none; outline: none;

    .meta-row { display: flex; gap: 14px; margin-bottom: 14px; flex-wrap: wrap; }
    .meta-field { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 130px; }

<script>
const OWNER = 'lumierefpx', REPO = 'lumierefeng', BRANCH = 'main';

// ── Token ────────────────────────────────────────────────
const getToken = () => localStorage.getItem('lf_token') || '';
const setToken = t  => localStorage.setItem('lf_token', t.trim());

function doSetup() {
  const t = document.getElementById('tokenIn').value.trim();
  if (!t) { showSetupErr('请输入 Token'); return; }
  setToken(t); boot();
}
function showSetupErr(m) {
  const e = document.getElementById('setupErr');
  e.textContent = m; e.style.display = 'block';
}
function openModal()  { document.getElementById('overlay').classList.add('on'); }
function closeModal() { document.getElementById('overlay').classList.remove('on'); }
function closeModalOutside(e) { if (e.target === e.currentTarget) closeModal(); }
function saveModalToken() {
  const t = document.getElementById('modalTok').value.trim();
  if (t) setToken(t);
  closeModal();
}

// ── Boot ─────────────────────────────────────────────────
function boot() {
  if (!getToken()) return;
  document.getElementById('setup').style.display = 'none';
  document.getElementById('writer').classList.add('on');
  document.getElementById('bottomBar').style.display = 'flex';

// ── Tabs ─────────────────────────────────────────────────
function tab(t) {
  const ta = document.getElementById('bodyIn');
  const pv = document.getElementById('previewPane');
  if (t === 'write') {
    ta.style.display = ''; pv.classList.remove('on');
    document.getElementById('btnW').classList.add('active');
    document.getElementById('btnP').classList.remove('active');
  } else {
    ta.style.display = 'none'; pv.classList.add('on');
    pv.innerHTML = mdHtml(ta.value);
    document.getElementById('btnW').classList.remove('active');
    document.getElementById('btnP').classList.add('active');
  }
}

// ── Markdown → HTML ──────────────────────────────────────
function mdHtml(text) {
  const lines = text.split('\n');
  const blocks = []; let buf = [];
  const flush = () => { if (buf.length) { blocks.push({t:'p', v:buf.join(' ')}); buf = []; }};
  let i = 0;
  while (i < lines.length) {
    const l = lines[i];
    if      (l.startsWith('### ')) { flush(); blocks.push({t:'h3', v:l.slice(4)}); }
    else if (l.startsWith('## '))  { flush(); blocks.push({t:'h2', v:l.slice(3)}); }
    else if (l.startsWith('# '))   { flush(); blocks.push({t:'h1', v:l.slice(2)}); }
    else if (l.startsWith('> '))   { flush(); blocks.push({t:'bq', v:l.slice(2)}); }
    else if (l.startsWith('- ') || l.startsWith('* ')) {
      flush();
      const items = [];
      while (i < lines.length && (lines[i].startsWith('- ') || lines[i].startsWith('* ')))
        items.push(lines[i++].slice(2));
      blocks.push({t:'ul', v:items}); continue;
    }
    else if (!l.trim()) { flush(); }
    else buf.push(l);
    i++;
  }
  flush();

  const inl = s => s
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/!\[([^\]]*)\]\(([^)]+)\)/g,'<img src="$2" alt="$1">')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2">$1</a>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,'<em>$1</em>');

  return blocks.map(b => {
    if (b.t==='h1') return `<h1>${inl(b.v)}</h1>`;
    if (b.t==='h2') return `<h2>${inl(b.v)}</h2>`;
    if (b.t==='h3') return `<h3>${inl(b.v)}</h3>`;
    if (b.t==='bq') return `<blockquote><p>${inl(b.v)}</p></blockquote>`;
    if (b.t==='ul') return `<ul>${b.v.map(x=>`<li>${inl(x)}</li>`).join('')}</ul>`;
    if (b.t==='p' && b.v.trim()) return `<p>${inl(b.v)}</p>`;
    return '';
  }).join('\n');
}

function firstLine(text, max=90) {
  for (const l of text.split('\n')) {
    const t = l.trim();
    if (t && !t.startsWith('#') && !t.startsWith('>') && !t.startsWith('!') && !t.startsWith('-')) {
      const c = t.replace(/\*\*(.+?)\*\*/g,'$1').replace(/\[([^\]]+)\]\([^)]+\)/g,'$1');
      return c.length > max ? c.slice(0,max).trimEnd()+'…' : c;
    }
  }
  return '';
}

// ── Slug + dates ─────────────────────────────────────────
function slug(s) {
  return s.trim().replace(/[^\w\u4e00-\u9fff-]/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'').slice(0,60)||'untitled';
}
const ML = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtL = d => { const[y,m,day]=d.split('-'); return `${ML[+m-1]} ${+day}, ${y}`; };
const fmtS = d => { const[y,m,day]=d.split('-'); return `${MS[+m-1]} ${+day}, ${y}`; };

// ── Base64 UTF-8 ─────────────────────────────────────────
function b64enc(s) {
  const b = new TextEncoder().encode(s); let r='';
  b.forEach(x=>r+=String.fromCharCode(x)); return btoa(r);
}
function b64dec(s) {
  const bin = atob(s.replace(/\n/g,'')), b = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) b[i]=bin.charCodeAt(i);
  return new TextDecoder().decode(b);
}

// ── GitHub API ───────────────────────────────────────────
async function ghGet(path) {
  const r = await fetch(`${API}/${path}`, {
    headers:{ Authorization:`token ${getToken()}`, Accept:'application/vnd.github.v3+json' }
  });
  if (!r.ok) throw new Error(`GET ${path}: ${r.status}`);
  const d = await r.json();
  return { content: b64dec(d.content), sha: d.sha };
}
async function ghPut(path, content, sha, msg) {
  const body = { message:msg, content:b64enc(content), branch:BRANCH };
  if (sha) body.sha = sha;
  const r = await fetch(`${API}/${path}`, {
    method:'PUT',
    headers:{ Authorization:`token ${getToken()}`, 'Content-Type':'application/json', Accept:'application/vnd.github.v3+json' },
    body: JSON.stringify(body)
  });
  if (!r.ok) { const e=await r.json().catch(()=>({})); throw new Error(`PUT ${path}: ${r.status} ${e.message||''}`); }
}

// ── Update blogs.html ────────────────────────────────────
function patchBlogs(html, {title, date, category, excerpt, href}) {
  const e = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const year = date.slice(0,4);

  const item =
    `            <a class="feed-item" href="${href}">\n` +
    `              <div class="feed-item-inner">\n` +
    `                <div class="feed-body">\n` +
    `                  <span class="feed-title">${e(title)}</span>\n` +
    `                  <p class="feed-excerpt">${e(excerpt)}</p>\n` +
    `                  <div class="feed-meta"><span>${fmtL(date)}</span>` +
    `<span class="feed-meta-dot"></span><span>${category}</span></div>\n` +
    `                </div>\n` +
    `                <span class="feed-arrow">→</span>\n` +
    `              </div>\n` +
    `            </a>`;

  const yr = new RegExp(`(<div class="year-divider">${year}<\\/div>\\s*)`);
  if (yr.test(html)) {
    html = html.replace(yr, `$1\n${item}\n`);
  } else {
    const grp =
      `          <div class="year-group" data-year="${year}">\n` +
      `            <div class="year-divider">${year}</div>\n\n` +
      `${item}\n\n          </div>`;
    html = html.replace('<!-- FEED_START -->', `<!-- FEED_START -->\n${grp}`);
  }

  html = html.replace(/(\d+) posts/, (_,n) => `${+n+1} posts`);

  const featured =
    `        <a id="featured-post" class="feed-featured"\n` +
    `           href="${href}"\n` +
    `           data-search-title="${e(title)}"\n` +
    `           data-search-excerpt="${e(excerpt)}">\n` +
    `          <div class="feed-featured-header">\n` +
    `            <span class="feed-featured-tag">Latest</span>\n` +
    `            <span class="feed-featured-date">${fmtL(date)}</span>\n` +
    `          </div>\n` +
    `          <span class="feed-featured-title">${e(title)}</span>\n` +
    `          <p class="feed-featured-excerpt">${e(excerpt)}</p>\n` +
    `          <div class="feed-featured-footer">\n` +
    `            <div class="feed-featured-meta"><span>${category}</span></div>\n` +
    `            <span class="feed-featured-cta">Read post →</span>\n` +
    `          </div>\n` +
    `        </a>`;
  html = html.replace(/<a id="featured-post"[\s\S]*?<\/a>/, featured);
  return html;
}

// ── Update index.html ────────────────────────────────────
function patchIndex(html, {title, date, excerpt, href}) {
  const e = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const card =
    `        <!-- Latest blog — text card -->\n` +
    `        <a class="home-card home-card-sm" href="${href}">\n` +
    `          <div>\n` +
    `            <div class="home-card-badge">Latest Blog</div>\n` +
    `            <h3 class="home-card-title">${e(title)}</h3>\n` +
    `            <p class="home-card-excerpt">${e(excerpt)}</p>\n` +
    `          </div>\n` +
    `          <div class="home-card-footer">\n` +
    `            <span class="home-card-date">${fmtS(date)}</span>\n` +
    `            <span class="home-card-arrow">→</span>\n` +
    `          </div>\n` +
    `        </a>`;
  return html.replace(
    /<!-- LATEST_BLOG_START -->[\s\S]*?<!-- LATEST_BLOG_END -->/,
    `<!-- LATEST_BLOG_START -->\n${card}\n        <!-- LATEST_BLOG_END -->`
  );
}

// ── Publish ──────────────────────────────────────────────
async function publish() {
  const title   = document.getElementById('titleIn').value.trim();
  const date    = document.getElementById('dateIn').value;
  const cat     = document.getElementById('catIn').value;
  const bodyMd  = document.getElementById('bodyIn').value.trim();
  let   excerpt = document.getElementById('excerptIn').value.trim();

  if (!title)  return setStatus('请填写标题', 'err');
  if (!date)   return setStatus('请选择日期', 'err');
  if (!bodyMd) return setStatus('正文不能为空', 'err');
  if (!excerpt) excerpt = firstLine(bodyMd);

  const s   = slug(title);
  const href = `posts/${s}.html`;
  const btn  = document.getElementById('pubBtn');
  btn.disabled = true;

  try {
    setStatus('检查文章是否已存在…');
    let sha = null;
    try { sha = (await ghGet(href)).sha; } catch(e) {}

    setStatus('创建文章文件…');
    await ghPut(href, makePostHtml(title, date, mdHtml(bodyMd)), sha, `Add post: ${title}`);

    setStatus('更新 blogs.html…');
    const { content: bc, sha: bs } = await ghGet('blogs.html');
    await ghPut('blogs.html', patchBlogs(bc, {title,date,category:cat,excerpt,href}), bs, `blogs: add "${title}"`);

    setStatus('更新首页…');
    const { content: ic, sha: is } = await ghGet('index.html');
    await ghPut('index.html', patchIndex(ic, {title,date,excerpt,href}), is, `index: latest "${title}"`);

    setStatus(`发布成功 ✓ &nbsp;约 1-2 分钟后生效 &nbsp;<a href="https://lumierefeng.com/${href}" target="_blank" style="color:var(--accent)">查看文章 →</a>`, 'ok');

    document.getElementById('titleIn').value = '';
    document.getElementById('bodyIn').value  = '';
    document.getElementById('excerptIn').value = '';
    document.getElementById('dateIn').value  = new Date().toISOString().slice(0,10);

  } catch(err) {
    console.error(err);
    setStatus('发布失败: ' + err.message, 'err');
  } finally {
    btn.disabled = false;
  }
}

function setStatus(msg, cls='') {
  const el = document.getElementById('statusEl');
  el.innerHTML = msg;
  el.className = 'status' + (cls ? ' '+cls : '');
}

// ── Image upload ─────────────────────────────────────────
async function handleImgFile(file) {
  if (!file || !file.type.startsWith('image/')) return;

  const btn = document.getElementById('btnImg');
  btn.disabled = true;
  setStatus('上传图片中…');

  try {
    // Sanitize filename with timestamp prefix to avoid collisions
    const ext  = file.name.split('.').pop().toLowerCase() || 'jpg';
    const base = file.name.replace(/\.[^.]+$/, '').replace(/[^a-zA-Z0-9\u4e00-\u9fff_-]/g, '-').slice(0, 40);
    const name = `${Date.now()}-${base}.${ext}`;
    const path = `images/${name}`;

    // Read as base64
    const b64 = await new Promise((res, rej) => {
      const r = new FileReader();
      r.onload  = () => res(r.result.split(',')[1]);
      r.onerror = rej;
      r.readAsDataURL(file);
    });

    // Check if file already exists (need SHA to update)
    let sha = null;
    try { sha = (await ghGet(path)).sha; } catch(e) {}

    // Upload — images are binary, send raw base64 directly
    const body = { message: `Upload image: ${name}`, content: b64, branch: BRANCH };
    if (sha) body.sha = sha;
    const r = await fetch(`${API}/${path}`, {
      method: 'PUT',
      headers: { Authorization: `token ${getToken()}`, 'Content-Type': 'application/json', Accept: 'application/vnd.github.v3+json' },
      body: JSON.stringify(body)
    });
    if (!r.ok) { const e = await r.json().catch(()=>({})); throw new Error(e.message || r.status); }

    // Insert markdown at cursor
    insertAtCursor(`![](../images/${name})`);
    setStatus(`图片已上传 ✓  ${name}`, 'ok');
  } catch(err) {
    setStatus('图片上传失败: ' + err.message, 'err');
  } finally {
    btn.disabled = false;
  }
}

function insertAtCursor(text) {
  const ta  = document.getElementById('bodyIn');
  const pos = ta.selectionStart;
  const before = ta.value.slice(0, pos);
  const after  = ta.value.slice(ta.selectionEnd);
  // Ensure image is on its own line
  const prefix = before.length && !before.endsWith('\n') ? '\n' : '';
  const suffix = after.length  && !after.startsWith('\n') ? '\n' : '';
  ta.value = before + prefix + text + suffix + after;
  const newPos = pos + prefix.length + text.length + suffix.length;
  ta.selectionStart = ta.selectionEnd = newPos;
  ta.focus();
}

// Drag-and-drop images onto textarea
function initDragDrop() {
  const ta = document.getElementById('bodyIn');
  ta.addEventListener('dragover', e => {
    e.preventDefault();
    ta.style.background = 'rgba(44,95,163,0.05)';
    ta.style.borderRadius = '8px';
  });
  ta.addEventListener('dragleave', () => {
    ta.style.background = '';
  });
  ta.addEventListener('drop', e => {
    e.preventDefault();
    ta.style.background = '';
    const file = [...e.dataTransfer.files].find(f => f.type.startsWith('image/'));
    if (file) handleImgFile(file);
  });
}

boot();
initDragDrop();
</script>
